services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pets", "-d", "pets"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      PET_REGISTRY_DB_HOST: db
      PET_REGISTRY_DB_PORT: "5432"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
